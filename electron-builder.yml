appId: com.rex.app
productName: REX
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true

mac:
  category: public.app-category.productivity
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSMicrophoneUsageDescription: REX records your voice and transcribes it locally on this Mac. Nothing is uploaded.
  target:
    - target: dmg
      arch:
        - arm64
        - x64

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
